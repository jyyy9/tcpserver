<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 / 注册</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #edf2f7;
            background: radial-gradient(circle at top, #3b82f6 0%, #0f172a 60%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .page {
            width: min(100%, 420px);
            padding: 24px;
        }
        .card {
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 28px;
            box-shadow: 0 32px 80px rgba(15, 23, 42, 0.35);
            overflow: hidden;
        }
        .header {
            padding: 28px 24px 16px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 0.03em;
        }
        .header p {
            margin: 10px 0 0;
            color: #a5b4fc;
            line-height: 1.6;
        }
        .tabs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px;
            padding: 0 24px 16px;
        }
        .tab {
            padding: 14px 18px;
            background: rgba(148, 163, 184, 0.08);
            border: 1px solid rgba(148, 163, 184, 0.14);
            border-radius: 16px;
            color: #cbd5e1;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }
        .tab.active {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            border-color: rgba(59, 130, 246, 0.6);
            color: #ffffff;
        }
        .content {
            padding: 0 24px 24px;
        }
        .field {
            margin-bottom: 16px;
        }
        .field label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #cbd5e1;
        }
        .field input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 16px;
            border: 1px solid rgba(148, 163, 184, 0.22);
            background: rgba(148, 163, 184, 0.08);
            color: #f8fafc;
            font-size: 1rem;
        }
        .field input:focus {
            outline: none;
            border-color: rgba(59, 130, 246, 0.8);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
        }
        .button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
        }
        .button:hover {
            transform: translateY(-1px);
            filter: brightness(1.05);
        }
        .message {
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 16px;
            background: rgba(15, 23, 42, 0.94);
            border: 1px solid rgba(148, 163, 184, 0.18);
            display: none;
            line-height: 1.5;
        }
        .message.success {
            border-color: rgba(34, 197, 94, 0.5);
            background: rgba(16, 185, 129, 0.12);
            color: #bbf7d0;
        }
        .message.error {
            border-color: rgba(239, 68, 68, 0.5);
            background: rgba(248, 113, 113, 0.12);
            color: #fecaca;
        }
        .hint {
            margin: 18px 0 0;
            font-size: 0.92rem;
            color: #94a3b8;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="card">
            <div class="header">
                <h1>欢迎回来</h1>
                <p>使用本页面进行登录或注册，所有操作由本地 HTTP 服务器处理。</p>
            </div>
            <div class="tabs">
                <button id="loginTab" class="tab active" type="button">登录</button>
                <button id="registerTab" class="tab" type="button">注册</button>
            </div>
            <div class="content">
                <form id="authForm">
                    <div class="field">
                        <label for="username">用户名</label>
                        <input id="username" name="username" type="text" placeholder="输入用户名" required />
                    </div>
                    <div class="field">
                        <label for="password">密码</label>
                        <input id="password" name="password" type="password" placeholder="输入密码" required />
                    </div>
                    <div class="field" id="confirmField" style="display:none;">
                        <label for="confirmPassword">确认密码</label>
                        <input id="confirmPassword" name="confirm_password" type="password" placeholder="再次输入密码" />
                    </div>
                    <button class="button" id="submitButton" type="submit">登录</button>
                </form>
                <div id="message" class="message"></div>
                <p class="hint" id="hintText">没有账号？请切换到注册页。</p>
            </div>
        </div>
    </div>
    <script>
        const loginTab = document.getElementById('loginTab');
        const registerTab = document.getElementById('registerTab');
        const authForm = document.getElementById('authForm');
        const confirmField = document.getElementById('confirmField');
        const submitButton = document.getElementById('submitButton');
        const messageBox = document.getElementById('message');
        const hintText = document.getElementById('hintText');

        let mode = 'login';

        function setMode(newMode) {
            mode = newMode;
            loginTab.classList.toggle('active', mode === 'login');
            registerTab.classList.toggle('active', mode === 'register');
            confirmField.style.display = mode === 'register' ? 'block' : 'none';
            submitButton.textContent = mode === 'login' ? '登录' : '注册';
            hintText.textContent = mode === 'login' ? '没有账号？请切换到注册页。' : '已有账号？请切换到登录页。';
            messageBox.style.display = 'none';
        }

        function encodeForm(data) {
            return Object.keys(data)
                .map(key => encodeURIComponent(key) + '=' + encodeURIComponent(data[key]))
                .join('&');
        }

        function showMessage(text, success) {
            messageBox.textContent = text;
            messageBox.className = 'message ' + (success ? 'success' : 'error');
            messageBox.style.display = 'block';
        }

        authForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const formData = {
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value.trim()
            };
            if (mode === 'registry') {
                formData.confirm_password = document.getElementById('confirmPassword').value.trim();
            }
            if (!formData.username || !formData.password || (mode === 'registry' && !formData.confirm_password)) {
                showMessage('请填写所有必填项。', false);
                return;
            }

            const apiPath = mode === 'login' ? '/login' : '/register';
            try {
                const response = await fetch(apiPath, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: encodeForm(formData)
                });
                const result = await response.json();
                showMessage(result.message || (response.ok ? '操作成功' : '操作失败'), response.ok && result.success);
                if (mode === 'registry' && response.ok && result.success) {
                    setMode('login');
                }
            } catch (error) {
                showMessage('无法连接到服务器，请稍后重试。', false);
            }
        });

        loginTab.addEventListener('click', () => setMode('login'));
        registerTab.addEventListener('click', () => setMode('register'));
    </script>
</body>
</html>
